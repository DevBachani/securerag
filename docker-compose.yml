# Qdrant runs by default (dev). The app stack (init, api, ui) is behind the "app"
# profile, so `docker compose up -d` starts only Qdrant, while `make demo`
# (docker compose --profile app up --build) starts everything.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: securerag-qdrant
    ports:
      - "6333:6333" # REST + dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # One-off: wait for Qdrant, seed demo users, ingest the corpus. Then exits.
  init:
    build: .
    profiles: ["app"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////data/securerag.db
      AGENT_CHECKPOINT_DB: /data/checkpoints.db
    volumes:
      - app_data:/data
    depends_on:
      qdrant:
        condition: service_started
    command: ["sh", "-c", "python scripts/wait_for_qdrant.py && python scripts/seed_users.py && python scripts/ingest.py --reset"]
    restart: "no"

  api:
    build: .
    profiles: ["app"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////data/securerag.db
      AGENT_CHECKPOINT_DB: /data/checkpoints.db
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health',timeout=3).status_code==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ["uvicorn", "securerag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build: .
    profiles: ["app"]
    env_file: [.env]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]

volumes:
  qdrant_storage:
  app_data:

[project]
name = "securerag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "diskcache>=5.6.3",
    "fastapi>=0.162.0",
    "fastembed>=0.9.0",
    "fpdf2>=2.8.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=3.2.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.1.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-fastembed>=0.7.0",
    "llama-index-llms-groq>=0.6.1",
    "llama-index-llms-ollama>=0.11.0",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pymupdf4llm==0.0.27",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.6.0",
    "streamlit>=1.66.1",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ layout: the importable package is securerag under src/.
packages = ["src/securerag"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
# Spec standard: one fast tool for lint + format. Line length matches Black's default.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear, D = docstrings.
select = ["E", "F", "I", "UP", "B", "D"]
# D203/D213 conflict with D211/D212; pick the common set. Allow missing docstrings in tests.
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"eval/**" = ["D", "E402"]  # eval runners install a compat shim before importing ragas
"src/securerag/api/**" = ["B008"]  # FastAPI's Depends()-in-defaults is the intended idiom
"ui/**" = ["D"]  # Streamlit app is script-style

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# src/ layout: make the `securerag` package importable in tests without an install step.
pythonpath = ["src"]

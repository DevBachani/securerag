name: Eval gate

on:
  pull_request:
    paths:
      - "src/**"
      - "eval/**"
      - "**/prompts.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      QDRANT_URL: http://localhost:6333
      DATABASE_URL: sqlite:///./ci.db
      AGENT_CHECKPOINT_DB: ./ci_checkpoints.db
      # The gate (leakage/injection/retrieval) is retrieval-only: no LLM, no secrets.
      # Rerank off avoids a ~1 GB model download; it doesn't affect these metrics.
      RERANK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Wait for Qdrant
        run: uv run python scripts/wait_for_qdrant.py
      - name: Seed users and ingest corpus
        run: |
          uv run python scripts/seed_users.py
          uv run python scripts/ingest.py --reset
      - name: Run eval (leakage, injection, retrieval)
        run: |
          uv run python eval/run_eval.py --leakage --config-name ci_leakage
          uv run python eval/run_eval.py --injection --config-name ci_injection
          uv run python eval/run_eval.py --retrieval-only --config-name ci_retrieval
      - name: Check eval gate against thresholds
        run: uv run python scripts/check_eval_gate.py
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
      - name: Comment results on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file eval/results/gate_comment.md
